<!--
  The mark: a cabinet of curiosities, standing on its feet, with four
  compartments and something bright kept in one of them.

  Drawn on a 16 by 16 grid with every edge on a whole unit, so that the
  16-pixel toolbar icon has no blurred edge. The blue is close to the app's
  link colour and holds on a light toolbar and on a dark one; the amber is
  the family of its search highlight. No letter is drawn: the title is the
  name read out in its place, and is the one thing here to change with it.

  This file is the source. `pnpm icons:build` renders the PNGs beside it and
  copies it to the web app; run it after any change here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <title>Curio</title>
  <rect x="2" y="12" width="2" height="3" rx="0.5" fill="#2563c9" />
  <rect x="12" y="12" width="2" height="3" rx="0.5" fill="#2563c9" />
  <rect x="1" y="1" width="14" height="12" rx="2" fill="#2563c9" />
  <rect x="3" y="3" width="3" height="3" rx="0.75" fill="#ffffff" />
  <rect x="7" y="3" width="6" height="3" rx="0.75" fill="#ffffff" />
  <rect x="3" y="7" width="6" height="4" rx="0.75" fill="#ffffff" />
  <rect x="10" y="7" width="3" height="4" rx="0.75" fill="#f7b83d" />
</svg>
